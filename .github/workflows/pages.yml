# Publishes the guided tour as the live demo on GitHub Pages whenever a release is published (or by hand).
# One-time setup in the repository: Settings → Pages → Source: "GitHub Actions".
name: Live demo

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: python build/build_all.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/dist/tour
      - id: deployment
        uses: actions/deploy-pages@v4
